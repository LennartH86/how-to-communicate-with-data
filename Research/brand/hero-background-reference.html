<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Background</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Outfit', 'DM Sans', 'Inter', system-ui, sans-serif;
    color: #111827;
    background-color: #fafafa;
    background-image:
      radial-gradient(at 0% 0%, hsla(250, 50%, 95%, 1) 0px, transparent 50%),
      radial-gradient(at 100% 0%, hsla(280, 45%, 95%, 1) 0px, transparent 50%),
      radial-gradient(at 0% 50%, hsla(220, 50%, 96%, 1) 0px, transparent 50%),
      radial-gradient(at 100% 50%, hsla(260, 40%, 96%, 1) 0px, transparent 50%),
      radial-gradient(at 0% 100%, hsla(230, 45%, 95%, 1) 0px, transparent 50%),
      radial-gradient(at 100% 100%, hsla(270, 45%, 95%, 1) 0px, transparent 50%);
  }

  /* Color blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .blob-blue {
    top: -15%;
    left: -10%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(50, 170, 240, 0.85) 0%, transparent 55%);
  }
  .blob-teal {
    bottom: -10%;
    right: -8%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(60, 170, 220, 0.7) 0%, transparent 60%);
  }
  .blob-purple {
    top: -10%;
    right: -5%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(190, 120, 220, 0.7) 0%, transparent 60%);
  }

  /* Glass panels */
  .glass-panels {
    position: absolute;
    inset: 0;
    display: flex;
    -webkit-mask-image:
      linear-gradient(to bottom, black 0%, black 45%, transparent 75%),
      linear-gradient(90deg, black 0%, black 10%, transparent 40%, transparent 60%, black 90%, black 100%);
    -webkit-mask-composite: source-in;
  }
  .glass-panel {
    height: 100%;
    flex-shrink: 0;
    width: 80px;
    margin-right: 80px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-left: 1px solid rgba(255, 255, 255, 0.12);
    border-right: 1px solid rgba(75, 85, 110, 0.08);
  }

  /* Blueprint grid */
  .grid-layer {
    position: absolute;
    inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 20%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.7) 70%, black 90%);
  }

  /* Noise texture */
  .noise-layer {
    position: absolute;
    inset: 0;
    opacity: 0.85;
  }

  /* Content layer */
  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
  }
</style>
</head>
<body>

  <!-- Blobs -->
  <div class="blob blob-blue"></div>
  <div class="blob blob-teal"></div>
  <div class="blob blob-purple"></div>

  <!-- Glass panels -->
  <div class="glass-panels">
    <div class="glass-panel"></div><div class="glass-panel"></div><div class="glass-panel"></div>
    <div class="glass-panel"></div><div class="glass-panel"></div><div class="glass-panel"></div>
    <div class="glass-panel"></div><div class="glass-panel"></div><div class="glass-panel"></div>
    <div class="glass-panel"></div><div class="glass-panel"></div><div class="glass-panel"></div>
  </div>

  <!-- Blueprint grid (SVG) -->
  <div class="grid-layer">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(160,160,160,0.12)" stroke-width="0.5"/>
        </pattern>
        <pattern id="majorGrid" width="80" height="80" patternUnits="userSpaceOnUse">
          <rect width="80" height="80" fill="url(#minorGrid)"/>
          <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(140,140,140,0.18)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#majorGrid)"/>
    </svg>
  </div>

  <!-- Noise texture -->
  <div class="noise-layer">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.5" intercept="0.85"/>
          <feFuncG type="linear" slope="0.5" intercept="0.85"/>
          <feFuncB type="linear" slope="0.5" intercept="0.85"/>
        </feComponentTransfer>
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)"/>
    </svg>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Veezoo logo -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 49" width="280" height="54" style="margin-bottom: 32px;">
      <path fill="#30c7df" fill-rule="evenodd" d="M189.69 2.59C201.92 2.59 211.82 12.5 211.82 24.73C211.82 36.95 201.92 46.86 189.69 46.86C177.47 46.86 167.56 36.95 167.56 24.73C167.56 12.5 177.47 2.59 189.69 2.59ZM209.34 24.73C209.34 15.22 201.64 7.52 192.14 7.52C182.64 7.52 174.94 15.22 174.94 24.73C174.94 34.23 182.64 41.93 192.14 41.93C201.64 41.93 209.34 34.23 209.34 24.73Z"/>
      <path fill="#30c7df" fill-rule="evenodd" d="M253.6 24.73C253.6 36.95 243.7 46.86 231.47 46.86C219.25 46.86 209.34 36.95 209.34 24.73C209.34 12.5 219.25 2.59 231.47 2.59C243.7 2.59 253.6 12.5 253.6 24.73ZM229.03 41.93C238.53 41.93 246.23 34.23 246.23 24.73C246.23 15.22 238.53 7.52 229.03 7.52C219.53 7.52 211.82 15.22 211.82 24.73C211.82 34.23 219.53 41.93 229.03 41.93Z"/>
      <path fill="#2c2e35" fill-rule="evenodd" d="M108.84 41.46C114.69 41.46 118.81 39.07 122.27 35.44L126.23 38.98C121.95 43.76 116.75 46.98 108.68 46.98C96.97 46.98 87.41 37.99 87.41 24.73C87.41 12.36 96.07 2.45 107.85 2.47C119.38 2.49 126.36 10.84 127.58 22.07C127.84 24.55 127.03 27.28 123.97 27.28L93.84 27.28C94.75 36.26 101.34 41.46 108.84 41.46ZM119.03 22.17C121.28 22.17 121.32 21.78 120.81 19.45C119.4 12.94 115.02 7.83 107.69 7.83C100.35 7.83 94.75 13.93 93.84 22.17L119.03 22.17Z"/>
      <path fill="#2c2e35" d="M28.83 43.08L45.96 3.15L39.55 3.15L25.1 38.59C24.44 40.12 23.72 40.12 23.12 38.59L8.73 3.18L2.18 3.18L19.24 43.08C20.71 47.39 26.96 47.41 28.83 43.08Z"/>
      <path fill="#2c2e35" d="M134.42 45.99L166.33 45.99L166.33 40.6L139.4 40.6C138.22 40.59 138.17 40.19 139.04 39.2L164.09 9.84C166.18 7.87 166.01 3.12 161.13 3.16L130.21 3.16L130.21 8.54L156.37 8.54C157.05 8.54 157.18 9.09 156.67 9.68L132.04 38.62C128.87 41.76 129.84 45.95 134.42 45.99Z"/>
      <path fill="#2c2e35" fill-rule="evenodd" d="M64.77 41.46C70.62 41.46 74.74 39.07 78.2 35.44L82.16 38.98C77.87 43.76 72.68 46.98 64.61 46.98C52.9 46.98 43.34 37.99 43.34 24.73C43.34 12.36 52 2.45 63.78 2.47C75.31 2.49 82.29 10.84 83.51 22.07C83.77 24.55 82.96 27.28 79.9 27.28L49.77 27.28C50.68 36.26 57.27 41.46 64.77 41.46ZM74.96 22.17C77.21 22.17 77.25 21.78 76.74 19.45C75.33 12.94 70.95 7.83 63.62 7.83C56.28 7.83 50.68 13.93 49.77 22.17L74.96 22.17Z"/>
    </svg>

    <!-- Tagline -->
    <h1 style="font-size: 88px; font-weight: 600; letter-spacing: -0.03em; text-align: center; line-height: 1.05;">
      Agentic Analytics<br>Engineered for Trust
    </h1>

    <!-- Demo input (static end state) -->
    <div style="
      margin-top: 36px;
      width: 820px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 30px -8px rgba(0,0,0,0.12), 0 10px 12px -6px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    ">
      <!-- Plus markers -->
      <span style="position:absolute; top:-14px; left:-14px; color:#9ca3af; font-size:16px; font-weight:300;">+</span>
      <span style="position:absolute; top:-14px; right:-14px; color:#9ca3af; font-size:16px; font-weight:300;">+</span>
      <span style="position:absolute; bottom:-14px; left:-14px; color:#9ca3af; font-size:16px; font-weight:300;">+</span>
      <span style="position:absolute; bottom:-14px; right:-14px; color:#9ca3af; font-size:16px; font-weight:300;">+</span>

      <!-- Query text -->
      <span style="flex: 1; font-size: 26px; color: #111827; font-family: 'Inter', system-ui, sans-serif;">
        Why did sales drop 15% last week in Germany?
      </span>

      <!-- Search icon with checkmark (end state) -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
        <circle cx="10" cy="10" r="6" stroke="#10b981" stroke-width="2" fill="rgba(16,185,129,0.08)"/>
        <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
        <path d="M7 10 L9 12 L13 8" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>

      <!-- Glow behind -->
      <div style="
        position: absolute;
        inset: 0;
        z-index: -1;
        filter: blur(48px);
        opacity: 0.2;
        background: linear-gradient(to right, rgba(191,219,254,0.5), rgba(216,180,254,0.5), rgba(165,243,252,0.5));
        transform: scale(1.1);
        border-radius: 20px;
      "></div>
    </div>
  </div>

</body>
</html>
